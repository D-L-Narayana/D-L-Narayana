name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG (light - purple theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rahul777111
          outputs: |
            dist/github-snake.svg?color_snake=#A78BFA&color_dots=#ebedf0,#c4b5fd,#a78bfa,#7c3aed,#4c1d95

      - name: Generate snake SVG (dark - purple neon theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rahul777111
          outputs: |
            dist/github-snake-dark.svg?color_snake=#A78BFA&color_dots=#1a1a2e,#2d1b69,#553c9a,#7c3aed,#a78bfa

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
